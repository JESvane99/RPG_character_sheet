services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      # - FLASK_ENV=development  # Uncomment for development mode
    volumes:
      # Use Docker named volumes for persistence (separate from local dev)
      - charsheet_db:/app/instance
      - charsheet_logs:/app/logs
      # Uncomment below for development (live code reload)
      # - .:/app
    restart: unless-stopped
    command: serve

  # Optional: PostgreSQL database service
  # Uncomment if you want to use PostgreSQL instead of SQLite
  # db:
  #   image: postgres:15
  #   environment:
  #     POSTGRES_DB: charsheet
  #     POSTGRES_USER: charsheet
  #     POSTGRES_PASSWORD: charsheet_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

# volumes:
#   postgres_data:

volumes:
  charsheet_db:
  charsheet_logs:
